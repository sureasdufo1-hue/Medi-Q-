.form-select:not(:disabled):hover {

.form-select:focus-visible {

}

.form-check {

  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:

    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)

  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {

  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,

}

.form-check-label {

}

  height: 20px;

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {

.form-switch .form-check-input:focus-visible {

.form-range::-webkit-slider-runnable-track {
  height: 28px;

}

  border-color: var(--ring);

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;

  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {

.btn:not(.btn-primary, .viz-tile):is(

  box-shadow: inset 0 0 0 1px var(--primary);

.btn:focus-visible,

  outline-offset: 2px;

}

svg {

  height: auto;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

t;&gt;Secret boundary&lt;/span&gt;&lt;span class=&quot;mq-feature-icon&quot;&gt;&lt;i data-lucide=&quot;lock-keyhole&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Client receives zero PACS credentials&lt;/strong&gt;&lt;p style=&quot;margin-top:14px&quot;&gt;Endpoint, password, KEK, DEK는 화면·DICOM payload·브라우저 로그에 표시되지 않습니다.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;mediq-origin-mockup&#x27;);
      const outlet = root.querySelector(&#x27;#mq-view&#x27;);
      const templates = {
        dashboard: root.querySelector(&#x27;#mq-dashboard&#x27;),
        exchange: root.querySelector(&#x27;#mq-exchange&#x27;),
        studies: root.querySelector(&#x27;#mq-studies&#x27;),
        viewer: root.querySelector(&#x27;#mq-viewer&#x27;),
        transfer: root.querySelector(&#x27;#mq-transfer&#x27;),
        audit: root.querySelector(&#x27;#mq-audit&#x27;),
        qr: root.querySelector(&#x27;#mq-qr&#x27;),
        connectors: root.querySelector(&#x27;#mq-connectors&#x27;)
      };
      const saved = window.openai?.widgetState;
      const state = {
        view: saved?.modelContent?.view &amp;&amp; templates[saved.modelContent.view] ? saved.modelContent.view : &#x27;dashboard&#x27;,
        tool: saved?.privateContent?.tool || &#x27;wl&#x27;
      };
      const design = {
        accent: saved?.privateContent?.accent || &#x27;#847dff&#x27;,
        density: saved?.privateContent?.density || &#x27;comfortable&#x27;,
        radius: Number(saved?.privateContent?.radius ?? 16)
      };
      function save() {
        window.openai?.setWidgetState?.({
          modelContent: { view: state.view },
          privateContent: { tool: state.tool, accent: design.accent, density: design.density, radius: design.radius }
        }).catch(() =&gt; {});
      }
      function applyDesign() {
        root.style.setProperty(&#x27;--mq-iris&#x27;, design.accent);
        root.style.setProperty(&#x27;--mq-radius&#x27;, `${design.radius}px`);
        root.querySelector(&#x27;.mq-main&#x27;).style.padding = design.density === &#x27;compact&#x27; ? &#x27;22px&#x27; : &#x27;&#x27;;
      }
      function render(shouldSave = false) {
        outlet.replaceChildren(templates[state.view].content.cloneNode(true));
        root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(button =&gt; {
          if (button.classList.contains(&#x27;mq-nav&#x27;)) button.setAttribute(&#x27;aria-selected&#x27;, String(button.dataset.view === state.view));
        });
        outlet.querySelectorAll(&#x27;[data-tool]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.tool === state.tool)));
        if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        if (shouldSave) save();
      }
      root.addEventListener(&#x27;click&#x27;, event =&gt; {
        const viewButton = event.target.closest(&#x27;[data-view]&#x27;);
        if (viewButton &amp;&amp; templates[viewButton.dataset.view]) {
          state.view = viewButton.dataset.view;
          render(true);
          return;
        }
        const toolButton = event.target.closest(&#x27;[data-tool]&#x27;);
        if (toolButton) {
          state.tool = toolButton.dataset.tool;
          render(true);
        }
      });
      applyDesign();
      render();
      if (globalThis.Tweak) {
        const tweak = new globalThis.Tweak({ container: root, onChange: () =&gt; { applyDesign(); render(true); } });
        tweak.addColorPicker(design, &#x27;accent&#x27;, { label: &#x27;Feature accent&#x27;, reference: &#x27;--mq-iris&#x27; });
        tweak.addSelect(design, &#x27;density&#x27;, { label: &#x27;Information density&#x27;, options: [{ label: &#x27;Comfortable&#x27;, value: &#x27;comfortable&#x27; }, { label: &#x27;Compact&#x27;, value: &#x27;compact&#x27; }], reference: &#x27;mediq.density&#x27; });
        tweak.addSlider(design, &#x27;radius&#x27;, { label: &#x27;Card radius&#x27;, min: 8, max: 30, step: 2, unit: &#x27;px&#x27;, reference: &#x27;--mq-radius&#x27; });
      }
      globalThis.addEventListener?.(&#x27;openai:set_globals&#x27;, event =&gt; {
        const next = event.detail?.globals?.widgetState;
        if (!next) return;
        if (next.modelContent?.view &amp;&amp; templates[next.modelContent.view]) state.view = next.modelContent.view;
        if (next.privateContent?.tool) state.tool = next.privateContent.tool;
        if (next.privateContent?.accent) design.accent = next.privateContent.accent;
        if (next.privateContent?.density) design.density = next.privateContent.density;
        if (Number.isFinite(next.privateContent?.radius)) design.radius = next.privateContent.radius;
        applyDesign();
        render();
      });
    })();
  &lt;/script&gt;

  const getTrigger = (target) =&gt;

      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;

  };
  const getTooltip = () =&gt; {

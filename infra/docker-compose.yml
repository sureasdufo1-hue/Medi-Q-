name: mediq

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_USER: ${MEDIQ_POSTGRES_USER:?Set MEDIQ_POSTGRES_USER in the ignored root .env}
      POSTGRES_PASSWORD: ${MEDIQ_POSTGRES_PASSWORD:?Set MEDIQ_POSTGRES_PASSWORD in the ignored root .env}
      POSTGRES_DB: ${MEDIQ_POSTGRES_DB:?Set MEDIQ_POSTGRES_DB in the ignored root .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - database
    volumes:
      - postgres-data:/var/lib/postgresql

  orthanc-a:
    image: orthancteam/orthanc:26.9.1@sha256:d2705f2c56547e55ce9bc2250fd22d05d326493b3f3d9fa191ecb7db8ca6b5a2
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC_PASSWORD: ${ORTHANC_A_PASSWORD:?Set ORTHANC_A_PASSWORD in the ignored root .env}
      ORTHANC__NAME: Hospital A Test Orthanc
      ORTHANC__DICOM_AET: MEDIQA
    ports:
      - "127.0.0.1:${ORTHANC_A_DICOM_HOST_PORT:-14242}:4242"
      - "127.0.0.1:${ORTHANC_A_HTTP_HOST_PORT:-18042}:8042"
    networks:
      - hospital-a
    volumes:
      - orthanc-a-data:/var/lib/orthanc/db

  orthanc-b:
    image: orthancteam/orthanc:26.9.1@sha256:d2705f2c56547e55ce9bc2250fd22d05d326493b3f3d9fa191ecb7db8ca6b5a2
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC_PASSWORD: ${ORTHANC_B_PASSWORD:?Set ORTHANC_B_PASSWORD in the ignored root .env}
      ORTHANC__NAME: Hospital B Test Orthanc
      ORTHANC__DICOM_AET: MEDIQB
    ports:
      - "127.0.0.1:${ORTHANC_B_DICOM_HOST_PORT:-14243}:4242"
      - "127.0.0.1:${ORTHANC_B_HTTP_HOST_PORT:-18043}:8042"
    networks:
      - hospital-b
    volumes:
      - orthanc-b-data:/var/lib/orthanc/db

networks:
  database:
    internal: true
  hospital-a:
    internal: true
  hospital-b:
    internal: true

volumes:
  postgres-data:
  orthanc-a-data:
  orthanc-b-data:
